<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ingredient Truth Checker</title>
  <style>
    /* Sakura glassmorphism: flat pink ground, one frosted panel, one accent */
    * { box-sizing: border-box; }

    :root {
      --ink: #5c2536;        /* dark rose text */
      --ink-soft: #7a4356;   /* secondary text */
      --accent: #d64a6f;     /* the single vivid accent */
      --hairline: rgba(165, 81, 102, 0.2);
    }

    /* Side panel: full browser height, glass panel fills it */
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: #E2B4C1;   /* same pink shade as the glass itself */
      position: relative;
      overflow: hidden;
    }

    /* Glassmorphism background: large soft-blurred shapes in the SAME pink
       family drifting behind the frosted panel, giving it the liquid depth */
    .blob {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      filter: blur(38px);
      opacity: 0.85;
    }
    .blob-1 { width: 260px; height: 260px; top: -70px;  left: -70px;  background: #bc5f77; }
    .blob-2 { width: 220px; height: 220px; top: 22%;    right: -90px; background: #ffffff; }
    .blob-3 { width: 300px; height: 300px; bottom: -90px; left: 15%;  background: #c97288; }
    .blob-4 { width: 170px; height: 170px; top: 52%;    left: -70px;  background: #ffe9f0; }

    /* Pink transparent liquid glass filling the whole side panel */
    .glass-shell {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 0;
      padding: 18px 16px;
      overflow: hidden;
    }

    h3 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.3px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* small brand dot, like the Sakura logo mark */
    h3::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Loader pill: the only solid element, accent colour, spinner only */
    .loader-pill {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 22px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .loader-pill.retry { cursor: pointer; }
    .hidden { display: none !important; }

    .spinner {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #result {
      font-size: 13px;
      flex: 1;
      overflow-y: auto;
      line-height: 1.5;
    }
    #result:not(:empty) { margin-top: 6px; }
    #result::-webkit-scrollbar { width: 5px; }
    #result::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 3px;
    }

    .section-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ink-soft);
      margin: 16px 2px 4px;
    }

    /* ── HERO: like the inner credit-card, the one slightly whiter glass card ── */
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 16px;
    }
    .ring {
      --score: 0;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(var(--accent) calc(var(--score) * 1%), rgba(255, 255, 255, 0.4) 0);
    }
    .ring-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ring-num {
      font-size: 20px;
      font-weight: bold;
      color: var(--ink);
      line-height: 1;
    }
    .ring-label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-top: 2px;
    }
    .hero-text { min-width: 0; }
    .verdict-word {
      font-size: 17px;
      font-weight: bold;
      color: var(--ink);
      margin-bottom: 3px;
    }
    .hero-oneliner { font-size: 12px; color: var(--ink-soft); }

    /* ── CLAIM ROWS: plain rows with hairline dividers, like form fields ── */
    .claim-row {
      cursor: pointer;
      padding: 10px 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .claim-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .claim-head strong {
      color: var(--ink);
      font-weight: bold;
      flex: 1;
      min-width: 0;
    }
    .verdict-icon {
      width: 18px;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      color: var(--accent);
      background: none;
    }
    .chev {
      color: var(--ink-soft);
      font-size: 10px;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .claim-row.open .chev { transform: rotate(180deg); }
    .claim-reality {
      max-height: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 12px;
      padding-left: 28px;
      transition: max-height 0.25s ease, margin-top 0.25s ease;
    }
    .claim-row.open .claim-reality {
      max-height: 90px;
      margin-top: 5px;
    }

    /* ── MATCH / AVOID: same plain hairline rows ── */
    .chip-wrap { display: block; }
    .chip {
      cursor: pointer;
      padding: 9px 2px;
      border-bottom: 1px solid var(--hairline);
      color: var(--ink);
      font-weight: bold;
      display: block;
    }
    .chip::before {
      display: inline-block;
      width: 18px;
      text-align: center;
      margin-right: 10px;
      font-weight: bold;
    }
    .chip-good::before { content: "✓"; color: var(--ink); }
    .chip-bad::before  { content: "✗"; color: var(--accent); }
    .chip-why {
      max-height: 0;
      overflow: hidden;
      font-weight: normal;
      font-size: 12px;
      color: var(--ink-soft);
      padding-left: 28px;
      transition: max-height 0.2s ease, margin-top 0.2s ease;
    }
    .chip.open .chip-why {
      max-height: 60px;
      margin-top: 4px;
    }

    /* ── HERO INGREDIENTS: name + plain-words job ── */
    .ing-row {
      padding: 9px 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .ing-row strong { color: var(--ink); }
    .ing-job {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    /* ── ROUTINE: label + value rows ── */
    .routine-row {
      display: flex;
      gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .routine-label {
      flex-shrink: 0;
      width: 78px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      padding-top: 2px;
    }
    .routine-value {
      color: var(--ink);
      font-size: 12px;
    }

    /* ── TIMELINE: result on the left, honest timeframe on the right ── */
    .time-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid var(--hairline);
    }
    .time-row strong { color: var(--ink); flex: 1; }
    .time-when {
      color: var(--ink-soft);
      font-size: 12px;
      text-align: right;
    }

    /* ── WATCH FLAGS: same chip rows, warning prefix ── */
    .chip-warn::before { content: "⚠"; color: var(--accent); }

    .disclaimer {
      margin: 14px 2px 4px;
      font-size: 10px;
      font-style: italic;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="glass-shell">
    <h3>Ingredient Truth Checker</h3>
    <div id="loader" class="loader-pill hidden"><span class="spinner"></span></div>
    <div id="result"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
