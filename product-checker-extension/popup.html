<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ingredient Truth Checker</title>
  <style>
    body {
      width: 350px;
      font-family: Arial, sans-serif;
      padding: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #result {
      margin-top: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .claim {
      margin-bottom: 8px;
      padding: 6px;
      border-radius: 4px;
    }
    .supported { background: #d8f3dc; }
    .partially-supported { background: #fff3bf; }
    .not-supported { background: #ffc9c9; }
  </style>
</head>
<body>
  <h3>Ingredient Truth Checker</h3>
  <button id="analyzeBtn">Analyze This Page</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
