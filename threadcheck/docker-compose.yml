services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threadcheck
      POSTGRES_PASSWORD: threadcheck
      POSTGRES_DB: threadcheck
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadcheck"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://threadcheck:threadcheck@db:5432/threadcheck
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
