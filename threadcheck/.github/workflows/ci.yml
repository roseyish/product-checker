name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      VECTOR_STORE: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Offline eval baseline (regression gate)
        run: |
          python -m eval.run_eval --out eval/results
          python - <<'PY'
          import glob, json
          s = json.load(open(sorted(glob.glob("eval/results/summary-*.json"))[-1]))
          assert s["recall@8"] >= 0.95, s
          assert s["citation_faithfulness"] >= 0.85, s
          print("eval gate passed")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t threadcheck:ci .
